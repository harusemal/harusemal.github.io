<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루세말 | 하루 세 가지 우리말 표현 · 3 Korean expressions a day</title>
<meta name="description" content="헷갈리는 우리말을 짝으로 비교해 하루 세 가지씩 익히는 문해력 연습. 결제와 결재, 사흘과 나흘, 금일과 금요일처럼.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="#today"><span class="mark">세</span>하루세말<small>3 Korean expressions a day</small></a>
  <nav>
    <a href="#today" data-tab="today">오늘</a>
    <a href="#saved" data-tab="saved">내 표현장</a>
    <a href="#flash" data-tab="flash">복습 카드</a>
    <a href="#quiz" data-tab="quiz">퀴즈</a>
    <button id="enToggle" class="en" title="English help">EN</button>
  </nav>
</header>

<main>
  <section id="tab-today" class="tab">
    <div class="dayhead"><h2 id="todayTitle">오늘의 세 표현</h2><p id="todayDate"></p></div>
    <div id="cards"></div>
  </section>

  <section id="tab-saved" class="tab" hidden>
    <div class="dayhead"><h2>내 표현장</h2><p>★를 눌러 담은 표현이 여기에 모입니다.</p></div>
    <div id="savedList"></div>
  </section>

  <section id="tab-flash" class="tab" hidden>
    <div class="dayhead"><h2>복습 카드</h2><p>카드를 눌러 뒤집고, 기억났는지 스스로 판단해 보세요.</p></div>
    <div id="flashArea"></div>
  </section>

  <section id="tab-quiz" class="tab" hidden>
    <div class="dayhead"><h2>퀴즈</h2><p>객관식과 단답형으로 확인해 보세요.</p></div>
    <div id="quizArea"></div>
  </section>
</main>

<footer class="site">
  <p>학습 기록(내 표현장, 복습 진도)은 서버로 보내지 않고 <b>이 브라우저에만</b> 저장됩니다.</p>
  <p>뜻풀이·요령·예문·그림은 하루세말이 직접 만들었으며, 제작에 AI를 활용하고 사람이 검수합니다.</p>
  <p>© 2026 하루세말 · 시제품(prototype)</p>
</footer>

<script src="data/expressions.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
